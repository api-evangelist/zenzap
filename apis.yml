- aid: zenzap:zenzap-oauth-api
  name: ZenZap OAuth API
  description: >-
    OAuth 2.0 `client_credentials` grant. Used by API-key bots that were created with `credentialType:
    oauth` to mint short-lived bearer access tokens.


    **In a nutshell:**

    1. Get a `clientId` and `clientSecret` from your bot in the Zenzap admin console. The `clientSecret`
    is shown once at creation; if lost, rotate it from the same screen.

    2. `POST /oauth/token` with `grant_type=client_credentials` to receive a JWT access token (1-hour
    TTL).

    3. Call any `/v2/*` endpoint with `Authorization: Bearer <access_token>`. No `X-Signature` / `X-Timestamp`
    headers are needed on the OAuth path.

    4. Re-mint when the token expires. There is **no refresh token**.


    Scopes are granular per endpoint — see the [Authentication page](/api-reference/authentication#oauth-scopes)
    for the full scope catalog and the endpoint → scope mapping.
  humanURL: https://docs.zenzap.co/api-reference/getting-started
  baseURL: https://api.zenzap.co
  tags:
  - Authentication
  tags_raw:
  - OAuth
  properties:
  - type: OpenAPI
    url: openapi/zenzap-oauth-api-openapi.yml
  - type: RateLimits
    url: https://docs.zenzap.co/api-reference/rate-limits
- aid: zenzap:zenzap-polls-api
  name: ZenZap Polls API
  description: >-
    Operations for creating polls, recording votes, and retracting votes.


    Polls are posted as messages in a topic. When you create a poll, each option is assigned a server-generated
    6-character ID — use those IDs as `optionId` when submitting votes.


    **Voting constraints:**

    - The bot must be a member of the topic the poll was posted in

    - Anonymous polls (`anonymous: true`) do not support voting via the API

    - Votes cannot be cast on closed or expired polls

    - Each `{pollId, optionId, voter}` combination is idempotent

    - Votes can be retracted with `DELETE /v2/polls/{pollId}/votes/{voteId}` using the `id` returned when
    the vote was cast
  humanURL: https://docs.zenzap.co/api-reference/getting-started
  baseURL: https://api.zenzap.co
  tags:
  - Polls
  properties:
  - type: OpenAPI
    url: openapi/zenzap-polls-api-openapi.yml
  - type: RateLimits
