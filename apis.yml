- aid: zenzap:zenzap-long-polling-api
  name: ZenZap Long Polling API
  description: >-
    Long polling allows your integration to fetch outbound events instead of receiving webhooks.


    Use `GET /v2/updates` with:

    - `offset`: value returned as `nextOffset` from the previous response

    - `limit`: max updates per request (default 50, max 100)

    - `timeout`: wait time in seconds when no updates are available (default 0, max 30)


    Event payloads in polling responses match webhook `data` payloads for the same event type.

    This includes `data.message.attachments[]` with signed URLs for file/image/video/audio messages.
  humanURL: https://docs.zenzap.co/api-reference/getting-started
  baseURL: https://api.zenzap.co
  tags:
  - Long Polling
  properties:
  - type: OpenAPI
    url: openapi/zenzap-long-polling-api-openapi.yml
  - type: RateLimits
    url: https://docs.zenzap.co/api-reference/rate-limits
