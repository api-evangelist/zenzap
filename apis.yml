aid: zenzap
name: ZenZap
description: >-
  Zenzap is an AI-native work communication platform — "Work Chat Built for the
  AI Era" — used by teams in healthcare, hospitality, construction, food
  service, retail, franchise, manufacturing, and non-profit operations. It
  organizes work into topics (group chats / channels / conversations) carrying
  messages, tasks, polls, reactions, and file attachments, with HIPAA and SOC 2
  compliance, SAML SSO, and SCIM provisioning for enterprises. The Zenzap
  External Integration API (v2) lets external applications and AI agents act as
  bots: create topics, send and manage messages, run tasks and polls, manage
  members, and receive events by webhook or long polling. Backed by Bessemer
  Venture Partners.
